<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Soccer Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Soccer Quiz</h1>

    <main>
        <p id="question">Click start to begin the quiz.</p>

        <button id="startButton">Start Quiz</button>

        <div id="answerArea">
            <button id="answerOne">Answer 1</button>
            <button id="answerTwo">Answer 2</button>
            <button id="answerThree">Answer 3</button>
        </div>

        <p id="result"></p>
        <p id="score">Score: 0</p>
    </main>
</body>
</html>
